spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Google sheet used to import the campaign the first time
pandemic.spreadsheet-id=1y3HicO9FcthZwH_DOC1J315JG3gcJrvUF4ssqZRyvhQ
# File where the campaign is saved after every draw, epidemic or legacy change
pandemic.campaign-file=campaign.json

# Add a content hash to static file URLs (predict-<hash>.css), so browsers pick up CSS changes
spring.resources.chain.strategy.content.enabled=true
spring.resources.chain.strategy.content.paths=/**
