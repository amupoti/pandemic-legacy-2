<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pandemic Legacy Season 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Open+Sans:wght@600;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/predict.css}">
</head>
<body class="app-page predict-page" th:classappend="${epidemicMode} ? 'epidemic-mode'">

<!-- Slim bar fixed at the top: only what is needed on every draw. Everything else is in the side menu -->
<header class="topbar">
    <button th:replace="~{layout :: menuButton}"></button>
    <div class="topbar-stats">
        <span title="Epidèmia actual"><span class="stat-icon">🦠</span> <span class="stat-label">Epidèmia</span> <strong th:text="${epidemicData.currentEpidemic == 'Infecció inicial'} ? 'Inicial' : ${epidemicData.currentEpidemic}"></strong></span>
        <span title="Ritme d'infecció"><span class="stat-icon">🔥</span> <span class="stat-label">Ritme</span> <strong th:text="${epidemicData.infectionRate}"></strong></span>
        <span title="Cartes per robar aquest torn"><span class="stat-icon">🃏</span> <span class="stat-label">Queden</span> <strong th:text="${epidemicData.cardsLeftThisTurn}"></strong></span>
    </div>
    <span class="topbar-last" th:if="${lastAction}" th:text="${lastAction}"></span>
    <form method="post" th:action="@{/undo}" th:if="${lastAction}">
        <button type="submit" class="btn btn-undo" title="Desfer l'última acció"><span class="undo-icon" aria-hidden="true">↶</span> <span class="undo-text">Desfer</span></button>
    </form>
    <a class="btn btn-danger" th:unless="${epidemicMode}" th:href="@{/(mode='epidemia')}">Epidèmia!</a>
</header>

<!-- Side menu: game info, next epidemic, help and the other pages -->
<div th:replace="~{layout :: menu('partida')}"></div>

<p class="flash error" th:if="${error}" th:text="${error}"></p>
<p class="flash" th:if="${message}" th:text="${message}"></p>

<div class="epidemic-banner" th:if="${epidemicMode}">
    <span>Epidèmia: toca la carta que has tret del <strong>fons de la pila</strong>.</span>
    <a class="btn" th:href="@{/}">Cancel·lar</a>
</div>
<p class="hint" th:if="${!epidemicMode and initialInfection != null}">
    <strong th:text="'Infecció inicial: ' + ${initialInfection} + ' de 9 cartes.'"></strong>
    Toca les cartes que robes per preparar la partida.</p>
<button type="button" class="warnings-chip" th:if="${!#lists.isEmpty(warnings)}" data-open-menu
        th:text="'⚠️ ' + ${#lists.size(warnings)} + (${#lists.size(warnings) == 1} ? ' avís per revisar' : ' avisos per revisar')"></button>

<div class="piles">
    <!-- Infection deck, from top to bottom -->
    <div class="pile-column">
        <div class="pile" th:each="infectionSet, setStat : ${infectionSets}"
             th:classappend="${setStat.last} ? 'pile-bottom'">
            <div class="section-header">
                <span class="title" th:text="${setStat.last} ? 'Fons de la pila' : 'Pila d\'infecció'">Pila d'infecció</span>
                <span class="card-count-inline" th:text="${#lists.size(infectionSet.cardsInEpidemic)}"></span>
            </div>
            <div class="separator"></div>
            <div class="card-grid">
                <form class="Card" method="post"
                      th:each="card : ${infectionSet.cardsInEpidemic}"
                      th:action="${epidemicMode} ? @{/epidemic/{id}(id=${card.id})} : @{/draw/{id}(id=${card.id})}"
                      th:style="'--card-color:' + ${card.color}">
                    <div th:replace="~{card :: cardFace(${card}, ${probability[card.cityName]})}"></div>
                    <button type="submit" class="card-hit"
                            th:title="${epidemicMode} ? 'Epidèmia a ' + ${card.cityName} : 'Robar ' + ${card.cityName}"
                            th:attr="aria-label=${epidemicMode} ? 'Epidèmia a ' + ${card.cityName} : 'Robar ' + ${card.cityName}"></button>
                </form>
            </div>
        </div>
    </div>

    <!-- Infection discard pile -->
    <div class="pile-column">
        <div class="pile">
            <div class="section-header">
                <span class="title">Descarts d'infecció</span>
                <span class="card-count-inline" th:text="${#lists.size(infectionDiscarded.cardsInEpidemic)}"></span>
            </div>
            <div class="separator"></div>
            <p class="empty" th:if="${#lists.isEmpty(infectionDiscarded.cardsInEpidemic)}">Encara no s'ha robat cap carta des de l'última epidèmia.</p>
            <div class="card-grid">
                <div class="Card" th:each="card : ${infectionDiscarded.cardsInEpidemic}"
                     th:style="'--card-color:' + ${card.color}">
                    <div th:replace="~{card :: cardFace(${card}, null)}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
